<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do PWA</title>

    <link rel="manifest" href="/manifest.json" />

    <link rel="apple-touch-icon" href="/icone.jpg" />
    <link rel="icon" type="image/jpeg" sizes="192x192" href="/icone.jpg" />
    <link rel="icon" type="image/jpeg" sizes="512x512" href="/icone.jpg" />

    <meta name="theme-color" content="#3174ad" />

    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => console.log('Service Worker registrado:', reg))
            .catch(err => console.log('Erro no Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
